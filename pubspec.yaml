name: wattcast
description: "WattCast - Sistem Pemantauan & Prediksi Token Listrik Berbasis Kalibrasi Presisi (100% lokal, tanpa backend)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3
  sqflite_common_ffi_web: ^1.1.3
  path: ^1.9.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  fl_chart: ^1.2.0
  file_picker: ^12.3.0
  file_saver: ^0.4.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true